[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "roar-cad"
version = "1.0.2"
description = "Robust Optimal Analog Reuse design, lookup and graphing API"
readme = "README.md"
# Python 3.11 is a required compatibility target; preserve it in dependency updates.
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "sympy", "matplotlib"]

[project.optional-dependencies]
gui = ["PyQt6==6.8", "PyQt6-QScintilla", "jedi", "pyqtgraph>=0.13", "PyOpenGL", "colorama", "pyqtdarktheme", "kiwisolver>=1.4"]

[project.scripts]
roar = "roar_api.__main__:main"

[tool.setuptools]
packages = ["roar_api", "roar_api._legacy", "roar_api.floorplan"]
py-modules = ["parse_netlist"]
package-dir = {"" = "src", "roar_api" = "roar_api", "roar_api._legacy" = "src/gui", "roar_api.floorplan" = "src/floorplan"}

[tool.setuptools.package-data]
"roar_api.floorplan" = ["align_profile.json", "ALIGN_SETUP.md"]
